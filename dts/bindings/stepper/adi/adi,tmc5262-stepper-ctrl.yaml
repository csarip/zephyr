compatible: "adi,tmc5262-stepper-ctrl"

include:
  - name: adi,trinamic-stallguard.yaml
    property-allowlist:
      - activate-stallguard2
      - stallguard-threshold-velocity
      - stallguard-velocity-check-interval-ms
  - name: adi,trinamic-ramp-generator.yaml
    property-allowlist:
      - vstart
      - a1
      - v1
      - amax
      - vmax
      - dmax
      - d1
      - vstop
      - tzerowait
      - thigh
      - tcoolthrs
      - tpwmthrs
      - tpowerdown
      - ihold
      - irun
      - iholddelay

properties:
  a2:
    type: int
    default: 0
    description: Third acceleration between V1 and V2 in [usteps/ta^2] (unsigned).

  v2:
    type: int
    default: 0
    description: Second acceleration / deceleration phase threshold velocity in [usteps/t].

  d2:
    type: int
    default: 1
    description: Deceleration between V2 and V1 in [usteps/ta^2] (unsigned).
