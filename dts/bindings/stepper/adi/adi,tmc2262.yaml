description: |
  Analog Devices TMC2262 two-phase stepper motor driver (SPI configuration, STEP/DIR
  motion source, 65 V, 4 A RMS). The device has no internal ramp generator: use a
  zephyr,gpio-step-dir-stepper-ctrl node whose "stepper-driver" property points to the
  adi,tmc5262-stepper-driver child of this node.

  Example:

    &spi1 {
        tmc2262: tmc2262@0 {
            compatible = "adi,tmc2262";
            reg = <0>;
            spi-max-frequency = <DT_FREQ_M(4)>;
            sleepn-gpios = <&gpiob 4 GPIO_ACTIVE_HIGH>;
            drv-enn-gpios = <&gpiob 5 GPIO_ACTIVE_LOW>;
            current-range-ma = <3000>;

            tmc2262_driver: stepper-driver {
                compatible = "adi,tmc5262-stepper-driver";
                micro-step-res = <16>;
            };
        };
    };

    step_dir_ctrl: motion-controller {
        compatible = "zephyr,gpio-step-dir-stepper-ctrl";
        step-gpios = <&gpiob 0 GPIO_ACTIVE_HIGH>;
        dir-gpios = <&gpiob 1 GPIO_ACTIVE_HIGH>;
        stepper-driver = <&tmc2262_driver>;
    };

compatible: "adi,tmc2262"

include:
  - name: spi-device.yaml
  - name: adi,tmc5262-base.yaml
  - name: adi,tmc5262-plus.yaml
  - name: adi,trinamic-ramp-generator.yaml
    property-allowlist:
      - tpwmthrs

properties:
  reg:
    required: true

  current-range-ma:
    type: int
    default: 1500
    enum:
      - 1500
      - 3000
      - 4500
      - 6000
    description: |
      DRV_CONF.CURRENT_RANGE, full scale peak current in mA at RREF = 12 kOhm.

  toff:
    type: int
    default: 5
    description: CHOPCONF.TOFF, off time and driver enable. 0 disables the driver.
    min: 0
    max: 15

  tbl:
    type: int
    default: 2
    description: CHOPCONF.TBL, comparator blank time (0 = ~1.25 us ... 3 = ~3.6 us).
    min: 0
    max: 3

  chm:
    type: boolean
    description: CHOPCONF.chm, constant off-time chopper instead of SpreadCycle.

  hstrt-tfd210:
    type: int
    default: 5
    description: CHOPCONF.HSTRT_TFD210, hysteresis start or fast decay time bits 2..0.
    min: 0
    max: 7

  hend-offset:
    type: int
    default: 4
    description: |
      CHOPCONF.HEND_OFFSET raw value 0..15 (hysteresis end or sine offset -3 .. +12).
    min: 0
    max: 15

  tpfd:
    type: int
    default: 4
    description: CHOPCONF.TPFD, passive fast decay time (0 = disabled).
    min: 0
    max: 15

  fd3:
    type: boolean
    description: CHOPCONF.fd3, MSB of the fast decay time with chm = 1.

  en-stealthchop:
    type: boolean
    description: |
      GCONF.en_stealthchop, enable StealthChop+ (depending on tpwmthrs). Can only be
      changed at standstill at run time.

  pwm-freq:
    type: int
    default: 0
    description: PWMCONF.PWM_FREQ, 0 = 19.5 kHz ... 8 = 58.6 kHz.
    min: 0
    max: 8

  freewheel:
    type: int
    default: 0
    description: |
      PWMCONF.FREEWHEEL, standstill behavior at IHOLD = 0 (0 normal, 1 freewheeling,
      2 passive braking LS, 3 passive braking HS).
    min: 0
    max: 3

  ol-thrsh:
    type: int
    default: 0
    description: PWMCONF.OL_THRSH, StealthChop+ open load sensitivity.
    min: 0
    max: 3

  sd-on-meas-lo:
    type: int
    default: 14
    description: PWMCONF.SD_ON_MEAS_LO, must be lower than sd-on-meas-hi.
    min: 0
    max: 15

  sd-on-meas-hi:
    type: int
    default: 15
    description: PWMCONF.SD_ON_MEAS_HI, must be higher than sd-on-meas-lo.
    min: 0
    max: 15

  do0-sources:
    enum:
      - error
      - otpw
      - stall
      - index
      - ov
      - udcstep
      - ev-n-deviation

  do1-sources:
    enum:
      - error
      - otpw
      - stall
      - index
      - ov
      - udcstep
      - ev-n-deviation
